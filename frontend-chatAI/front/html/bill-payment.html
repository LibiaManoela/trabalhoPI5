<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/shared.css">
    <title>HCI Vitta | Pagar conta</title>
</head>
<body>
    <header>
        <div class="header-left">
            <a class="brand-link" href="index.html">
                <img class="brand-logo" src="../../imagens/logo.jpeg" alt="HCI Vitta logo" />
                <div class="brand-meta">
                    <span class="brand-name">HCI Vitta</span>
                    <span class="brand-slogan">Pagamento fácil</span>
                </div>
            </a>
        </div>
        <nav class="header-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="transactions.html">Transações</a>
            <a href="contact.html">Contato</a>
        </nav>
    </header>

    <main class="page-content">
        <section class="page-title">
            <p class="eyebrow">Pagamento</p>
            <h1>Pague suas contas de forma simples</h1>
            <p>Use o código de barras e confirme o valor para pagar rapidamente sem complicação.</p>
        </section>

        <section class="form-card">
            <h2>Pagar conta</h2>
            <form id="pagarContaForm">
                <div class="form-group">
                    <label for="codigoBarras">Código de barras</label>
                    <input type="text" id="codigoBarras" name="codigoBarras" placeholder="00000000000000000000000000000000000000000000" required>
                </div>
                <div class="form-group">
                    <label for="valor">Valor</label>
                    <input type="number" id="valor" name="valor" placeholder="R$ 0,00" required>
                </div>
                <button class="button button-primary" type="submit">Pagar</button>
            </form>
        </section>
    </main>

    <footer>
        <small>HCI Vitta © 2026 | Pagamentos rápidos e seguros.</small>
    </footer>
    <script src="../js/pagarConta.js"></script>
</body>
</html>
