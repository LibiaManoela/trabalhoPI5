<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCI Vitta | Login</title>
    <link rel="stylesheet" href="../css/app.css">
    <script src="../js/app.js" defer></script>
</head>
<body>
    <header>
        <div class="header-left">
            <a class="brand-link" href="index.html">
                <img class="brand-logo" src="../../imagens/logo.jpeg" alt="HCI Vitta logo" />
                <div class="brand-meta">
                    <span class="brand-name">HCI Vitta</span>
                    <span class="brand-slogan">Acesso seguro</span>
                </div>
            </a>
        </div>
        <nav class="header-nav">
            <a href="index.html">Sobre</a>
            <a href="contact.html">Contato</a>
        </nav>
        <div class="header-actions">
            <a class="button button-secondary" href="dashboard.html">Voltar</a>
        </div>
    </header>

    <main class="page-content">
        <section class="page-title">
            <p class="eyebrow">Acesso</p>
            <h1>Entre no seu painel de saúde</h1>
            <p>Use seu usuário e senha para acessar consultas, exames e histórico médico.</p>
        </section>

        <section class="form-card">
            <h2>Login</h2>
            <form>
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" placeholder="Digite seu usuário" />
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha" />
                </div>
                <button class="button button-primary" type="button" onclick="login()">Entrar</button>
                <p id="error-message" class="page-note"></p>
            </form>
            <p class="page-note">Acesso exclusivo para pacientes do HCI Vitta Saúde.</p>
        </section>
    </main>

    <footer>
        <small>HCI Vitta © 2026 | Segurança e cuidado.</small>
    </footer>
</body>
</html>
