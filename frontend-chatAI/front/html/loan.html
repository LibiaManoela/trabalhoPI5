<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/shared.css">
    <title>HCI Vitta | Empréstimo</title>
</head>
<body>
    <header>
        <div class="header-left">
            <a class="brand-link" href="index.html">
                <img class="brand-logo" src="../../imagens/logo.jpeg" alt="HCI Vitta logo" />
                <div class="brand-meta">
                    <span class="brand-name">HCI Vitta</span>
                    <span class="brand-slogan">Simulação rápida</span>
                </div>
            </a>
        </div>
        <nav class="header-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="transactions.html">Transações</a>
            <a href="contact.html">Contato</a>
        </nav>
    </header>

    <main class="page-content">
        <section class="page-title">
            <p class="eyebrow">Empréstimo</p>
            <h1>Solicite seu empréstimo com condições claras</h1>
            <p>Escolha o valor e o número de parcelas para ver a proposta instantaneamente.</p>
        </section>

        <section class="form-card">
            <h2>Simulação de empréstimo</h2>
            <form id="emprestimoForm">
                <div class="form-group">
                    <label for="valor">Valor do Empréstimo</label>
                    <input type="number" id="valor" name="valor" placeholder="R$ 0,00" required>
                </div>
                <div class="form-group">
                    <label for="parcelas">Número de Parcelas</label>
                    <input type="number" id="parcelas" name="parcelas" placeholder="12" required>
                </div>
                <button class="button button-primary" type="submit">Enviar solicitação</button>
            </form>
        </section>
    </main>

    <footer>
        <small>HCI Vitta © 2026 | Empréstimos com transparência.</small>
    </footer>
</body>
</html>
