<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/app.css">
    <title>HCI Vitta | Plano de Cuidados</title>
</head>
<body>
    <header>
        <div class="header-left">
            <a class="brand-link" href="index.html">
                <img class="brand-logo" src="../../imagens/logo.jpeg" alt="HCI Vitta logo" />
                <div class="brand-meta">
                    <span class="brand-name">HCI Vitta</span>
                    <span class="brand-slogan">Plano de cuidados</span>
                </div>
            </a>
        </div>
        <nav class="header-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="history.html">Histórico</a>
            <a href="contact.html">Contato</a>
        </nav>
    </header>

    <main class="page-content">
        <section class="page-title">
            <p class="eyebrow">Plano</p>
            <h1>Monte seu plano de cuidados personalizado</h1>
            <p>Escolha metas e serviços para receber recomendações específicas de saúde.</p>
        </section>

        <section class="form-card">
            <h2>Plano de cuidados</h2>
            <form id="emprestimoForm">
                <div class="form-group">
                    <label for="valor">Objetivo de saúde</label>
                    <input type="text" id="valor" name="valor" placeholder="Ex: controle da pressão" required>
                </div>
                <div class="form-group">
                    <label for="parcelas">Tipo de plano</label>
                    <input type="text" id="parcelas" name="parcelas" placeholder="Básico, Premium" required>
                </div>
                <button class="button button-primary" type="submit">Enviar solicitação</button>
            </form>
        </section>
    </main>

    <footer>
        <small>HCI Vitta © 2026 | Planos de saúde personalizados.</small>
    </footer>
</body>
</html>
