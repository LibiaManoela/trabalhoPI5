<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/app.css">
    <title>HCI Vitta | Teleconsulta</title>
</head>
<body>
    <header>
        <div class="header-left">
            <a class="brand-link" href="index.html">
                <img class="brand-logo" src="../../imagens/logo.jpeg" alt="HCI Vitta logo" />
                <div class="brand-meta">
                    <span class="brand-name">HCI Vitta</span>
                    <span class="brand-slogan">Consulta online</span>
                </div>
            </a>
        </div>
        <nav class="header-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="contact.html">Contato</a>
        </nav>
    </header>

    <main class="page-content">
        <section class="page-title">
            <p class="eyebrow">Teleconsulta</p>
            <h1>Solicite uma teleconsulta em poucos passos</h1>
            <p>Descreva seus sintomas e agende um atendimento remoto com um profissional de saúde.</p>
        </section>

        <section class="form-card">
            <h2>Solicitar teleconsulta</h2>
            <form id="teleconsultaForm">
                <div class="form-group">
                    <label for="sintoma">Descreva o sintoma</label>
                    <input type="text" id="sintoma" name="sintoma" placeholder="Dor de cabeça, febre, cansaço" required>
                </div>
                <div class="form-group">
                    <label for="urgencia">Nível de urgência</label>
                    <input type="number" id="urgencia" name="urgencia" placeholder="1 a 10" min="1" max="10" required>
                </div>
                <button class="button button-primary" type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <small>HCI Vitta © 2026 | Teleconsulta rápida e segura.</small>
    </footer>
    <script src="../js/teleconsulta.js"></script>
</body>
</html>
